<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAS – teamet</title>
<style>
  :root {
    --bg: #0d0f13; --surface: #151820; --surface-2: #1b1f29; --border: #262b36; --fg: #eceef2; --muted: #8a93a5;
    --work: #5b8cff; --work-soft: rgba(91, 140, 255, .14);
    --wait: #f0b44c; --wait-soft: rgba(240, 180, 76, .14);
    --free: #59606e; --free-soft: rgba(138, 147, 165, .10);
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f7f8fa; --border: #e2e5eb; --fg: #151820; --muted: #5d6676;
      --work: #2f6bf0; --work-soft: rgba(47, 107, 240, .10);
      --wait: #c47f0a; --wait-soft: rgba(224, 150, 20, .14);
      --free: #9aa1ad; --free-soft: rgba(93, 102, 118, .08);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 18px 48px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* header */
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 0; }
  .live { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .live .pulse { width: 8px; height: 8px; border-radius: 50%; background: #3fbf7f; }
  .live.stale .pulse { background: var(--wait); }
  .live button { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .live button:hover { border-color: var(--muted); }

  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; }
  .pill b { font-size: 15px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--free); flex: none; }
  .working .dot, .dot.working { background: var(--work); }
  .waiting .dot, .dot.waiting { background: var(--wait); }

  .alert { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--wait-soft); border: 1px solid color-mix(in srgb, var(--wait) 45%, transparent); }
  .alert svg { color: var(--wait); margin-top: 1px; }
  .alert div { display: grid; gap: 2px; }

  h2 { display: flex; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 34px 0 12px; }
  h2 span { font-weight: 400; letter-spacing: 0; text-transform: none; }

  /* role cards */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 580px) { .grid { grid-template-columns: 1fr; } }
  .card { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--free); opacity: .5; }
  .card.working::before { background: var(--work); opacity: 1; }
  .card.waiting::before { background: var(--wait); opacity: 1; }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px 17px; }
  .icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--free-soft); color: var(--muted); flex: none; }
  .working .icon { background: var(--work-soft); color: var(--work); }
  .waiting .icon { background: var(--wait-soft); color: var(--wait); }
  .who { min-width: 0; flex: 1; }
  .who b { display: block; font-size: 15px; }
  .who small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--free-soft); color: var(--muted); flex: none; }
  .badge.working { background: var(--work-soft); color: var(--work); }
  .badge.waiting { background: var(--wait-soft); color: var(--wait); }
  .badge.working .dot { animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--work) 60%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
  @media (prefers-reduced-motion: reduce) { .badge.working .dot { animation: none; } }

  .jobs { list-style: none; margin: 0; padding: 0 14px 14px 17px; display: grid; gap: 8px; }
  .job { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; }
  .job-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .job-top b { font-size: 14px; }
  .job-top time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .job p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .job.waiting { border-color: color-mix(in srgb, var(--wait) 50%, var(--border)); }
  .job.stale { opacity: .55; }
  .empty { margin: 0 14px 14px 17px; padding: 9px 11px; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); font-size: 13px; }

  /* projects */
  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .proj { padding: 14px 14px 14px 17px; }
  .proj-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .proj-head b { font-size: 15px; }
  .proj-head small { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
  .chip svg { width: 13px; height: 13px; }
  .quiet { margin-top: 8px; color: var(--muted); font-size: 13px; }

  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  footer code { font-size: 11px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">Ryngmark Agent System</div>
      <h1>Teamet just nu</h1>
    </div>
    <div class="live" id="live"><span class="pulse"></span><span id="updated">Laddar…</span><button id="refresh" type="button">Uppdatera</button></div>
  </header>

  <div class="summary" id="summary" aria-live="polite"></div>
  <div id="alerts"></div>

  <h2>Roller <span id="roles-note"></span></h2>
  <section class="grid" id="team"></section>

  <h2>Projekt <span id="projects-note"></span></h2>
  <section class="projects" id="projects"></section>

  <footer>
    Uppdateras av RAS Project Manager vid varje överlämning (<code>tools/ras-status.ps1</code>). Sidan hämtar ny status
    varannan minut.
  </footer>
</main>

<script>
const REPO = "Ryngmarks/ras-board";
const API_URL = `https://api.github.com/repos/${REPO}/contents/status.json?ref=status`;
const RAW_URL = `https://raw.githubusercontent.com/${REPO}/status/status.json`;
const POLL_MS = 120_000;          // unauthenticated GitHub API: 60 calls/h per IP, shared by every open tab
const STALE_MS = 12 * 3600_000;

const ICONS = {
  "project-manager": '<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.41a2 2 0 0 1-1.27 1.27L7.76 16.24l1.8-5.41a2 2 0 0 1 1.27-1.27z"/>',
  "solution-architect": '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>',
  "engineering-analyst": '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  "research": '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  "implementer": '<path d="m15 12-8.5 8.5a2.12 2.12 0 0 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25a3.2 3.2 0 0 1-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/>',
  "reviewer": '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  "tester": '<path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3 3 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/>',
  "other": '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  "alert": '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
};
const ROLES = [
  ["project-manager", "Project Manager", "Leder, delegerar, pratar med dig"],
  ["solution-architect", "Solution Architect", "Draft och blueprint"],
  ["engineering-analyst", "Engineering Analyst", "Prior art och retro"],
  ["research", "Research", "Externa fakta med källor"],
  ["implementer", "Implementer", "Bygger work orders"],
  ["reviewer", "Reviewer", "Granskar kod och design"],
  ["tester", "Tester", "Försöker få det att gå sönder"],
];
const STATE = { working: "Jobbar", waiting: "Väntar", idle: "Ledig" };

let etag = null, data = null, source = null, lastFetch = null, failed = false;

const icon = id => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id] || ICONS.other}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isStale = e => Date.now() - Date.parse(e.since) > STALE_MS;

function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (!isFinite(s)) return "";
  if (s < 90) return "nyss";
  if (s < 3600) return Math.round(s / 60) + " min";
  if (s < 86400) return Math.round(s / 3600) + " h";
  return Math.round(s / 86400) + " d";
}

function stateOf(jobs) {
  const live = jobs.filter(j => !isStale(j));
  if (live.some(j => j.state === "working")) return "working";
  if (live.some(j => j.state === "waiting")) return "waiting";
  return "idle";
}

function render() {
  const entries = Array.isArray(data?.entries) ? data.entries : [];
  const known = new Map(ROLES.map(r => [r[0], r]));
  const roles = ROLES.concat([...new Set(entries.map(e => e.role))].filter(r => !known.has(r)).map(r => [r, r, ""]));
  const roleName = Object.fromEntries(roles.map(r => [r[0], r[1]]));

  // header
  document.getElementById("updated").textContent = data?.updated
    ? (ago(data.updated) === "nyss" ? "Ändrad nyss" : `Ändrad för ${ago(data.updated)} sedan`) + (source === "raw" ? " · cache, upp till 5 min gammal" : "")
    : (failed ? "Kunde inte hämta status" : "Ingen status ännu");
  document.getElementById("live").classList.toggle("stale", failed || source === "raw");

  // summary
  const states = roles.map(([id]) => stateOf(entries.filter(e => e.role === id)));
  const liveEntries = entries.filter(e => !isStale(e));
  const counts = {
    working: liveEntries.filter(e => e.state === "working").length,
    waiting: liveEntries.filter(e => e.state === "waiting").length,
    idle: states.filter(x => x === "idle").length,
  };
  const label = { working: "uppdrag pågår", waiting: "väntar", idle: "lediga roller" };
  document.getElementById("summary").innerHTML = ["working", "waiting", "idle"].map(s =>
    `<span class="pill ${s}"><span class="dot"></span><b>${counts[s]}</b> ${label[s]}</span>`).join("");

  // waiting alerts
  const waiting = entries.filter(e => e.state === "waiting" && !isStale(e));
  document.getElementById("alerts").innerHTML = waiting.map(e =>
    `<div class="alert" role="status">${icon("alert")}<div><b>${esc(roleName[e.role] || e.role)} väntar · ${esc(e.project)}</b>` +
    `<span>${esc(e.note || "väntar på svar")} · ${ago(e.since)}</span></div></div>`).join("");
  document.title = (waiting.length ? `(${waiting.length}) väntar · ` : "") + "RAS – teamet";

  // role cards
  const active = states.filter(s => s !== "idle").length;
  document.getElementById("roles-note").textContent = `${active} av ${roles.length} aktiva`;
  document.getElementById("team").innerHTML = roles.map(([id, name, desc], i) => {
    const jobs = entries.filter(e => e.role === id)
      .sort((a, b) => (a.state === "working" ? 0 : 1) - (b.state === "working" ? 0 : 1) || Date.parse(b.since) - Date.parse(a.since));
    const s = states[i];
    const body = jobs.length
      ? `<ul class="jobs">${jobs.map(j => `<li class="job ${j.state}${isStale(j) ? " stale" : ""}">
          <div class="job-top"><b>${esc(j.project)}</b><time datetime="${esc(j.since)}">${isStale(j) ? "inaktiv " : ""}${ago(j.since)}</time></div>
          <p>${j.state === "waiting" ? "Väntar" : "Jobbar"}${j.note ? " – " + esc(j.note) : ""}</p></li>`).join("")}</ul>`
      : `<div class="empty">Inget uppdrag just nu</div>`;
    return `<article class="card ${s}">
      <div class="card-head"><div class="icon">${icon(id)}</div>
        <div class="who"><b>${esc(name)}</b><small>${esc(desc)}</small></div>
        <span class="badge ${s}"><span class="dot"></span>${STATE[s]}</span></div>${body}</article>`;
  }).join("");

  // projects
  const byProject = new Map();
  for (const p of Array.isArray(data?.projects) ? data.projects : []) byProject.set(p, []);
  for (const e of entries) { if (!byProject.has(e.project)) byProject.set(e.project, []); byProject.get(e.project).push(e); }
  const rank = l => ({ working: 0, waiting: 1, idle: 2 })[stateOf(l)];
  const list = [...byProject].sort((a, b) => rank(a[1]) - rank(b[1]) || a[0].localeCompare(b[0], "sv"));
  document.getElementById("projects-note").textContent = `${list.length} st`;
  document.getElementById("projects").innerHTML = list.length ? list.map(([p, l]) => {
    const s = stateOf(l);
    const live = l.filter(e => !isStale(e));
    return `<article class="card proj ${s}"><div class="proj-head"><b>${esc(p)}</b>
      <small>${live.length ? live.length + (live.length === 1 ? " roll" : " roller") : "lugnt"}</small></div>
      ${live.length ? `<div class="chips">${live.map(e =>
        `<span class="chip">${icon(e.role)}${esc(roleName[e.role] || e.role)}<span class="dot ${e.state}"></span></span>`).join("")}</div>`
        : `<div class="quiet">Inga aktiva roller</div>`}</article>`;
  }).join("") : `<div class="empty">Inga projekt ännu</div>`;
}

async function load() {
  if (window.RAS_DEMO) { data = window.RAS_DEMO; source = "api"; render(); return; }
  lastFetch = Date.now();
  try {
    const headers = { Accept: "application/vnd.github.raw+json" };
    if (etag) headers["If-None-Match"] = etag;
    const res = await fetch(API_URL, { headers, cache: "no-store" });
    if (res.status === 304) { source = "api"; failed = false; return render(); }
    if (!res.ok) throw new Error(String(res.status));
    etag = res.headers.get("ETag");
    data = await res.json(); source = "api"; failed = false;
  } catch {
    // Rate limit or network trouble: the raw file has no call limit but is cached for up to 5 minutes.
    try {
      const res = await fetch(RAW_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(String(res.status));
      data = await res.json(); source = "raw"; failed = false;
    } catch { failed = true; }
  }
  render();
}

document.getElementById("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - (lastFetch || 0) > 60_000) load();
});
setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
setInterval(render, 30_000);
load();
</script>
</body>
</html>
