<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>AI Benja Motion Graphic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 1600x900 stage scaled to fit, ten timed scenes; the dark-blue orchestrator rail sits above every agent scene. */
:root{
  --bg:#EEF1F5; --stage:#F7F8FA; --surface:#FFFFFF; --line:#D5DBE5; --fg:#1A2333; --muted:#5A6678;
  --pm:#123E7C; --pm-ink:#FFFFFF;
  --a1:#2F9BE3; --a2:#1C8A3C; --a3:#B88A00; --a4:#DD6B10; --a5:#8560C4; --hu:#3A485D;
  --ok:#1C8A3C; --dev:#DD6B10; --miss:#7C8696; --pdf:#C4314B; --xls:#1C8A3C; --hold:#FFC83D; --hold-ink:#2A2000;
  --sh:0 1px 2px rgba(20,35,60,.06),0 6px 18px rgba(20,35,60,.07);
  --font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C111B; --stage:#121927; --surface:#1A2334; --line:#2E3B52; --fg:#E7ECF5; --muted:#9BA8BC;
  --pm:#1D55A8; --pm-ink:#FFFFFF;
  --a1:#4CAEEF; --a2:#3DB060; --a3:#D9A91A; --a4:#F08432; --a5:#A283DC; --hu:#56667F;
  --ok:#3DB060; --dev:#F08432; --miss:#8B96A8; --pdf:#E0566E; --xls:#3DB060; --hold:#FFC83D; --hold-ink:#2A2000;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C111B; --stage:#121927; --surface:#1A2334; --line:#2E3B52; --fg:#E7ECF5; --muted:#9BA8BC;
  --pm:#1D55A8; --pm-ink:#FFFFFF;
  --a1:#4CAEEF; --a2:#3DB060; --a3:#D9A91A; --a4:#F08432; --a5:#A283DC; --hu:#56667F;
  --ok:#3DB060; --dev:#F08432; --miss:#8B96A8; --pdf:#E0566E; --xls:#3DB060; --hold:#FFC83D; --hold-ink:#2A2000;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.page{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.top{width:100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.top p{margin:0;color:var(--muted);font-size:14px}
.player{position:relative;width:100%;aspect-ratio:16/9;max-width:max(300px,calc((100dvh - 190px)*16/9));
  background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.player:fullscreen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;font-size:20px;line-height:1.3;
  background:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--pm) 7%,var(--stage)),var(--stage))}
.ctl{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.ctl button{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;height:34px;min-width:34px;padding:0 11px;cursor:pointer}
.ctl button:hover{border-color:var(--pm)}
.ctl button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.ctl .main{background:var(--pm);color:var(--pm-ink);border-color:var(--pm);min-width:76px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots button{padding:0;width:34px;font-variant-numeric:tabular-nums}
.dots button[aria-current="true"]{background:var(--pm);color:var(--pm-ink);border-color:var(--pm)}
.now{font-size:13px;color:var(--muted);min-width:0;flex:1 1 180px}
.bar{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pm)}

/* ---------- animation engine ---------- */
.scene{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.scene.on{opacity:1}
.a{opacity:0}
.scene.run .a{animation:in .6s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
.scene.run .a.x{animation:in .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both,mv var(--mt,.9s) var(--d2,0s) var(--me,cubic-bezier(.5,0,.2,1)) forwards}
@keyframes in{from{opacity:0;transform:translate(var(--fx,0),var(--fy,14px)) scale(var(--fs,1))}to{opacity:1;transform:none}}
@keyframes mv{to{opacity:var(--to,1);transform:translate(var(--tx,0),var(--ty,0)) scale(var(--ts,1))}}
.pop{--fy:0px;--fs:.86}
.fade{--fy:0px}
.flow{stroke:var(--c,var(--pm));stroke-width:2.5;fill:none;stroke-dasharray:5 7}
.scene.run .flow{animation:in .6s var(--d,0s) both,dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.scene.run .live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.paused .scene *{animation-play-state:paused!important}
@media (prefers-reduced-motion: reduce){
  .scene{transition:none}
  .scene.run .a,.scene.run .a.x{animation-duration:.01s!important;animation-delay:0s!important}
  .scene.run .flow,.scene.run .live{animation:none;opacity:1}
}

/* ---------- shared pieces ---------- */
.stage *{box-sizing:border-box}
.p{position:absolute}
.ic{flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;gap:12px;height:62px;padding:0 22px;border-bottom:1px solid var(--line);font-weight:600;font-size:21px}
.ch small{margin-left:auto;font-weight:500;font-size:16px;color:var(--muted)}
.title{position:absolute;left:60px;top:96px;font-size:46px;font-weight:600;letter-spacing:-.01em}
.mark{position:absolute;right:60px;top:40px;font-size:17px;color:var(--muted);letter-spacing:.04em}
.mark b{color:var(--pm);letter-spacing:.12em}
:root[data-theme="dark"] .mark b{color:var(--a1)}
.cap{position:absolute;left:60px;right:60px;top:812px;text-align:center;font-size:30px;font-weight:600;letter-spacing:.005em}
.tile{display:grid;place-items:center;flex:none;border-radius:8px;background:var(--c);color:#fff}

.rail{position:absolute;left:40px;top:22px;width:1520px;height:66px;border-radius:10px;background:var(--pm);color:var(--pm-ink);
  display:flex;align-items:center;gap:18px;padding:0 20px;box-shadow:var(--sh)}
.rail .rt{display:grid;place-items:center;width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.16)}
.rail b{font-weight:600}
.rail .rn{display:flex;flex-direction:column;line-height:1.2}
.rail .rn b{font-size:21px}
.rail span{font-size:14px;opacity:.78}
.rail .rp,.rail .rs{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid rgba(255,255,255,.25);height:38px}
.rail .rp b{font-size:19px;font-variant-numeric:tabular-nums}
.pw{position:relative;width:310px;height:34px}
.pill{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;white-space:nowrap;
  font-style:normal;font-size:15px;font-weight:700;letter-spacing:.06em;background:#fff;color:#123E7C}
.pill.hold{background:var(--hold);color:var(--hold-ink)}
.rsteps{margin-left:auto;display:flex;gap:6px}
.rsteps i{font-style:normal;font-size:14px;font-weight:700;width:42px;height:30px;border-radius:6px;display:grid;place-items:center;
  border:1.5px solid rgba(255,255,255,.35);color:rgba(255,255,255,.6)}
.rsteps i.dn{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.rsteps i.cu{background:var(--c);color:#fff;border-color:#fff}

.ahead{position:absolute;display:flex;align-items:center;gap:16px}
.ahead .at{width:66px;height:66px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center}
.ahead small{display:block;font-size:15px;color:var(--muted);letter-spacing:.03em}
.ahead b{display:block;font-size:36px;font-weight:600;letter-spacing:-.01em}

.file{position:absolute;display:flex;align-items:center;gap:12px;height:54px;padding:0 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;font-size:18px;white-space:nowrap;box-shadow:0 1px 2px rgba(20,35,60,.06)}
.file em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--c);width:36px;height:30px;border-radius:5px;display:grid;place-items:center;flex:none}
.note{color:var(--muted);font-size:16px}
.sk{height:10px;border-radius:5px;background:color-mix(in srgb,var(--muted) 22%,var(--surface))}

.hband{position:absolute;display:flex;align-items:center;gap:20px;padding:0 26px;border-radius:10px;background:var(--hu);color:#fff;box-shadow:var(--sh)}
.hband .ht{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.hband b{display:block;font-size:24px;letter-spacing:.07em}
.hband span{display:block;font-size:18px;opacity:.86}
.stamp{margin-left:auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;background:#fff;color:#1C6B34;font-weight:700;font-size:17px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-size:14px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--c);white-space:nowrap}
.tint{background:color-mix(in srgb,var(--c) 11%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.row{display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tick{color:var(--ok);display:grid;place-items:center}
.num{font-variant-numeric:tabular-nums}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.500-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
<symbol id="i-hub" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="4" r="1.8"/><circle cx="4.500" cy="17.500" r="1.8"/><circle cx="19.500" cy="17.500" r="1.8"/><path d="M12 5.8V9M9.500 13.700l-3.500 2.600M14.500 13.700l3.500 2.600"/></symbol>
<symbol id="i-intake" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.500l9 5 9-5"/><path d="M3 17l9 5 9-5"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.200"/><path d="M12 2.500V6M12 18v3.500M2.500 12H6M18 12h3.500M5.300 5.300l2.500 2.500M16.200 16.200l2.500 2.500M5.300 18.700l2.500-2.500M16.200 7.800l2.500-2.500"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-5M12 16V8M16 16v-3"/></symbol>

<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></symbol>
<symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.500"/><path d="M5 20c0-3.900 3.100-6 7-6s7 2.100 7 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4.500M12 17.300v.2"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.500"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.2M4 12h.2M4 18h.2"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V6M6 11l6-6 6 6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.500 9.300c-.4-.8-1.300-1.300-2.500-1.300-1.500 0-2.500.7-2.500 1.800 0 2.600 5 1.300 5 4 0 1.100-1 1.900-2.500 1.900-1.300 0-2.200-.5-2.600-1.400M12 6.500V8M12 15.700v1.800"/></symbol>

<symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 115 0c0 1.500-2.500 2-2.500 3.700M12 16.600v.2"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.700 0l3-3a4 4 0 00-5.700-5.700l-1 1M14 10a4 4 0 00-5.700 0l-3 3a4 4 0 005.700 5.700l1-1"/></symbol>
</defs></svg>

<div class="page">
  <div class="top"><h1>AI Benja</h1><p>AI Agents for Sales &amp; Engineering · animated overview</p></div>
  <div class="player" id="player"><div class="stage" id="stage" aria-live="off"></div></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="ctl">
    <button id="prev" aria-label="Previous scene">‹</button>
    <button id="play" class="main">Pause</button>
    <button id="next" aria-label="Next scene">›</button>
    <div class="dots" id="dots"></div>
    <div class="now" id="now"></div>
    <button id="full">Fullscreen</button>
  </div>
</div>

<script>
(function(){
const P=(x,y,w,h)=>`left:${x}px;top:${y}px;`+(w?`width:${w}px;`:'')+(h?`height:${h}px;`:'');
const ic=(n,s=24)=>`<svg class="ic" width="${s}" height="${s}"><use href="#i-${n}"/></svg>`;
const AG=[['Requirement Intake','intake'],['Documentation','layers'],['Engineering','gear'],['Commercial Analysis','chart'],['Quote','quote']];
const FILES=['Technical Specification.pdf','Requirements.xlsx','Drawings.pdf','Customer Standard.pdf'];
const file=(name,x,y,w,style='',cls='a')=>{const xl=/xlsx$/.test(name);
  return `<div class="file ${cls}" style="${P(x,y,w)}--c:var(--${xl?'xls':'pdf'});${style}"><em>${xl?'XLSX':'PDF'}</em>${name}</div>`};
const rail=(idx,s1,s2,t2)=>`<div class="rail">
  <div class="rt">${ic('hub',28)}</div>
  <div class="rn"><b>PL – AI Project Manager</b><span>Orchestrator · monitors every step</span></div>
  <div class="rp"><span>Project</span><b>RFQ-12345</b></div>
  <div class="rs"><span>Status</span><div class="pw">
    <i class="pill a fade ${s2?'x':''}" style="--d:.2s;--d2:${t2}s;--to:0;--mt:.35s">${s1}</i>
    ${s2?`<i class="pill hold a fade" style="--d:${t2+.3}s">${ic('pause',16)}${s2}</i>`:''}</div></div>
  <div class="rsteps">${AG.map((a,i)=>`<i class="${i<idx?'dn':i==idx?'cu':''}" style="--c:var(--a${i+1})">A${i+1}</i>`).join('')}</div></div>`;
const head=n=>`<div class="ahead a" style="${P(60,104)}--d:.3s;--c:var(--a${n})"><div class="at">${ic(AG[n-1][1],36)}</div>
  <div><small>Specialist agent · activated by the AI Project Manager</small><b>A${n} – ${AG[n-1][0]} Agent</b></div></div>`;
const hband=(y,t,title,text,stamp,ts)=>`<div class="hband a" style="${P(60,y,1480,92)}--d:${t}s">
  <div class="ht">${ic('person',32)}</div><div><b>${title}</b><span>${text}</span></div>
  ${stamp?`<div class="stamp a pop" style="--d:${ts}s">${ic('check',20)}${stamp}</div>`:''}</div>`;
const cap=(t,txt)=>`<div class="cap a" style="--d:${t}s">${txt}</div>`;
const mark=`<div class="mark"><b>AI BENJA</b> · AI Agents for Sales &amp; Engineering</div>`;

const scenes=[];

/* 1 — Customer RFQ */
scenes.push({name:'Customer RFQ',dur:11.5,html:`${mark}
<div class="title a" style="--d:.2s">Incoming Customer RFQ</div>
<div class="card a" style="${P(60,190,680,490)}--d:.6s">
  <div class="ch"><span class="tile" style="--c:var(--a1);width:38px;height:38px">${ic('mail',22)}</span>Customer Procurement<small>09:12</small></div>
  <div style="padding:22px">
    <div style="font-size:26px;font-weight:600">RFQ-12345 – Request for Quotation</div>
    <div class="note" style="margin-top:6px">To: Sales</div>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:26px">
      <div class="sk" style="width:92%"></div><div class="sk" style="width:84%"></div><div class="sk" style="width:58%"></div></div>
    <div class="note" style="margin-top:44px;font-weight:600">4 attachments</div>
  </div></div>
${FILES.map((f,i)=>file(f,i%2?410:80,i<2?540:606,310,`--d:${1.6+i*.25}s;opacity:.55`,'a')).join('')}
<div class="card a" style="${P(880,190,660,350)}--d:3.2s">
  <div class="ch"><span class="tile" style="--c:var(--pm);width:38px;height:38px">${ic('folder',22)}</span>Customer Project<small class="num">RFQ-12345</small></div>
  ${FILES.map((f,i)=>`<div class="note a p" style="${P(372,90+i*60)}--d:${5.2+i*.5}s;--fx:-10px;--fy:0px;display:flex;gap:8px;align-items:center"><span class="tick">${ic('check',20)}</span>Linked to project</div>`).join('')}
</div>
${FILES.map((f,i)=>{const ax=i%2?410:80,ay=i<2?540:606;
  return file(f,ax,ay,310,`--d:${3.9+i*.5}s;--d2:${4.2+i*.5}s;--tx:${900-ax}px;--ty:${268+i*60-ay}px;--fy:0px`,'a x')}).join('')}
<svg class="p" style="left:0;top:0" width="1600" height="900"><path class="flow a" style="--d:8s" d="M1210 540V584"/></svg>
<div class="card tint a" style="${P(880,584,660,96)}--d:8s;--c:var(--a2);display:flex;align-items:center;gap:18px;padding:0 22px">
  <span class="tile" style="--c:var(--a2);width:52px;height:52px">${ic('shield',30)}</span>
  <div><div style="font-weight:600;font-size:22px">Originals stored securely in SharePoint</div><div class="note">4 original documents · versioned · unchanged</div></div>
  <span class="a pop" style="--d:9s;margin-left:auto;color:var(--a2)">${ic('lock',30)}</span></div>
${cap(6.8,'One RFQ – Multiple Documents – One Project')}`});

/* 2 — AI Project Manager */
const RESP=[['Monitor','eye'],['Coordinate','swap'],['Delegate','send'],['Track','list'],['Escalate','up']];
scenes.push({name:'AI Project Manager',dur:11,html:`

  <span class="a pop" style="--d:${6+i*.9}s;margin-left:auto;width:44px;height:44px;border-radius:50%;background:#fff;color:#1C6B34;display:grid;place-items:center;flex:none">${ic('check',26)}</span></div>
  <div class="p a pop" style="${P(888,243+i*192,24,24)}--d:${5.4+i*.9}s;border-radius:50%;background:var(--${h[2]});border:4px solid var(--stage)"></div>`).join('')}
${cap(8.6,'AI supports the process. People keep control of critical technical and commercial decisions.')}`});

/* 10 — Final result */
const CH=[['CUSTOMER','RFQ','mail','miss'],['A1','INTAKE','intake','a1'],['A2','DOCUMENTATION','layers','a2'],['A3','ENGINEERING','gear','a3'],['HUMAN','REVIEW','person','hu'],['A4','COMMERCIAL','chart','a4'],['HUMAN','REVIEW','person','hu'],['A5','QUOTE','quote','a5'],['FINAL','APPROVAL','person','hu'],['CUSTOMER','QUOTATION','check','ok']];
scenes.push({name:'Final result',dur:16,html:`
<div class="p a" style="${P(39,70,1522,74)}--d:.3s;--fy:-14px;background:var(--pm);color:var(--pm-ink);border-radius:10px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;gap:16px">
  ${ic('hub',34)}<b style="font-size:26px;letter-spacing:.1em">AI PROJECT MANAGER</b><span style="font-size:18px;opacity:.82">coordinates the whole chain</span></div>
<svg class="p" style="left:0;top:0" width="1600" height="900">
  ${CH.map((c,i)=>`<path class="flow a" style="--d:${1+i*.55}s" d="M${107+i*154} 144V214"/>`).join('')}
  <path d="M60 366H1540" stroke="var(--line)" stroke-width="3"/></svg>
${CH.map((c,i)=>`<div class="p a pop" style="${P(39+i*154,214,136,120)}--d:${1.1+i*.55}s;--c:var(--${c[3]});border-radius:10px;box-shadow:var(--sh);
  ${c[3]=='hu'?'background:var(--hu);color:#fff;':'background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1.5px solid var(--c);'}display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center">
  <span style="${c[3]=='hu'?'':'color:var(--c)'}">${ic(c[2],30)}</span><div style="font-size:13.5px;font-weight:700;letter-spacing:.04em;line-height:1.25">${c[0]}<br>${c[1]}</div></div>
  ${i<9?`<div class="p a fade" style="${P(175+i*154,256,18)}--d:${1.3+i*.55}s;text-align:center;font-size:24px;font-weight:700;color:var(--muted);line-height:34px">›</div>`:''}`).join('')}
<div class="p a x" style="${P(97,356,20,20)}--d:1.1s;--d2:1.3s;--tx:1386px;--mt:5.2s;--me:linear;border-radius:50%;background:var(--pm);border:4px solid var(--stage)"></div>
<div class="p a" style="${P(0,440,1600)}--d:7.6s;--fy:24px;text-align:center;font-size:132px;font-weight:700;letter-spacing:.14em;line-height:1;color:var(--pm-title,var(--fg))">AI BENJA</div>
<div class="p a" style="${P(0,606,1600)}--d:9s;text-align:center;font-size:38px;font-weight:600">From customer requirements to structured decision support</div>
<div class="p a" style="${P(0,690,1600)}--d:10.4s;display:flex;justify-content:center;gap:18px">
  ${[['Traceable.','a1'],['Controlled.','pm'],['Human-approved.','hu']].map((t,i)=>`<span class="a pop" style="--d:${10.6+i*.5}s;font-size:26px;font-weight:600;padding:10px 26px;border-radius:30px;border:1.5px solid var(--${t[1]});background:color-mix(in srgb,var(--${t[1]}) 12%,var(--surface))">${t[0]}</span>`).join('')}</div>`});

/* ---------- player ---------- */
const stage=document.getElementById('stage'),player=document.getElementById('player');
const els=scenes.map(s=>{const d=document.createElement('section');d.className='scene';d.innerHTML=s.html;stage.appendChild(d);return d});
const total=scenes.reduce((a,s)=>a+s.dur,0);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=0,t=0,playing=!reduce,ended=false,last=null;
const $=id=>document.getElementById(id);
const dots=$('dots');
scenes.forEach((s,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=s.name;b.setAttribute('aria-label','Scene '+(i+1)+': '+s.name);b.onclick=()=>show(i);dots.appendChild(b)});
function ui(){
  [...dots.children].forEach((b,i)=>b.setAttribute('aria-current',i===cur));
  $('now').textContent='Scene '+(cur+1)+' of '+scenes.length+' · '+scenes[cur].name;
  $('play').textContent=ended?'Replay':playing?'Pause':'Play';
  stage.classList.toggle('paused',!playing&&!reduce);
}
function show(i){
  els.forEach((e,j)=>{if(j===i)return;
    if(e.classList.contains('on')){e.classList.remove('on');setTimeout(()=>{if(!e.classList.contains('on'))e.classList.remove('run')},520)}
    else e.classList.remove('run')});
  const e=els[i];e.classList.remove('run');void e.offsetWidth;e.classList.add('run','on');
  cur=i;t=0;ended=false;ui();
}
function frame(now){
  if(last!==null&&playing&&!document.hidden){
    t+=Math.min(now-last,100)/1000;
    if(t>=scenes[cur].dur){ if(cur<scenes.length-1)show(cur+1); else{t=scenes[cur].dur;playing=false;ended=true;ui()} }
  }
  last=now;
  let done=0;for(let i=0;i<cur;i++)done+=scenes[i].dur;
  $('prog').style.width=((done+t)/total*100)+'%';
  requestAnimationFrame(frame);
}
$('play').onclick=()=>{ if(ended){playing=!reduce;show(0)} else{playing=!playing;ui()} };
$('prev').onclick=()=>show(Math.max(0,cur-1));
$('next').onclick=()=>show(Math.min(scenes.length-1,cur+1));
$('full').onclick=()=>{ if(document.fullscreenElement)document.exitFullscreen(); else if(player.requestFullscreen)player.requestFullscreen().catch(()=>{}) };
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&e.key===' ')return;
  if(e.key===' '){e.preventDefault();$('play').click()}
  else if(e.key==='ArrowRight')$('next').click();
  else if(e.key==='ArrowLeft')$('prev').click();
});
document.addEventListener('visibilitychange',()=>stage.classList.toggle('paused',document.hidden||(!playing&&!reduce)));
function fit(){const w=player.clientWidth,h=player.clientHeight,s=Math.min(w/1600,h/900);
  stage.style.transform='translate('+((w-1600*s)/2)+'px,'+((h-900*s)/2)+'px) scale('+s+')'}
new ResizeObserver(fit).observe(player);fit();
show(0);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
