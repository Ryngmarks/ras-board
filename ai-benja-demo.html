<style>
/* Layout: suite bar, compact left navigation, one work surface. Single light look by choice (enterprise tool). */
:root{
  color-scheme:light;
  --bg:#F5F5F5; --surface:#FFFFFF; --sub:#FAFAFA; --line:#E0E0E0; --line2:#EDEBE9; --fg:#242424; --muted:#616161;
  --brand:#0F6CBD; --brand-d:#115EA3; --brand-bg:#EBF3FC;
  --ok:#0E700E; --ok-bg:#F1FAF1; --wait:#7A5200; --wait-bg:#FFF4CE; --warn:#B4470A; --warn-bg:#FDF3EC; --err:#B10E1C; --err-bg:#FDF3F4; --neu:#424242; --neu-bg:#F0F0F0;
  --c-outlook:#0F6CBD; --c-sp:#038387; --c-pa:#2266E3; --c-teams:#5B5FC7; --c-ai:#3B3A39; --c-cond:#605E5C; --c-appr:#8A6A00; --c-excel:#107C41; --c-word:#185ABD; --c-pdf:#B10E1C;
  --font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.43}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.suite{background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;min-height:48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.waffle{display:grid;grid-template-columns:repeat(3,4px);gap:3px}
.waffle i{width:4px;height:4px;background:#fff;border-radius:1px}
.suite b{font-size:16px;font-weight:600}
.suite .app{opacity:.9}
.suite .chip{font-size:12px;border:1px solid rgba(255,255,255,.6);border-radius:4px;padding:1px 8px;white-space:nowrap}
.suite .me{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--brand-d);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.note{background:var(--wait-bg);color:#3D2E00;font-size:12.5px;padding-block:6px;border-bottom:1px solid #F2E3A6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100% - 80px)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:1px}
.rail .grp{font-size:12px;color:var(--muted);padding:12px 16px 4px}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 16px 0 13px;border:0;border-left:3px solid transparent;background:none;text-align:left;width:100%;white-space:nowrap}
.nav:hover{background:var(--neu-bg)}
.nav[aria-current="true"]{border-left-color:var(--brand);background:var(--brand-bg);font-weight:600}
.nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#C19C00}
.tile{flex:none;width:20px;height:20px;border-radius:4px;background:var(--c,var(--neu));color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;letter-spacing:0}
.work{min-width:0;display:flex;flex-direction:column}
.cmd{background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 16px}
.cmd .sp{margin-left:auto}
.btn{height:32px;padding:0 12px;border-radius:4px;border:1px solid #D1D1D1;background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#F5F5F5}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.sub{border-color:transparent;font-weight:400}
.btn[disabled]{color:#BDBDBD;background:#F0F0F0;border-color:#F0F0F0;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--brand-bg);border-color:var(--brand);color:var(--brand-d)}
.content{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%}
.guide{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:4px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.guide .k{font-size:12px;color:var(--muted)}
.guide h3{font-size:16px;font-weight:600}
.guide .val{font-size:13px;margin-top:4px}
.guide .val b{color:var(--brand-d)}
.guide .hint{font-size:13px;color:var(--wait);font-weight:600;margin-top:4px}
.guide .ga{display:flex;gap:6px}
.vh h2{font-size:20px;font-weight:600}
.vh p{color:var(--muted);max-width:76ch}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.meta b{color:var(--fg);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0}
.panel>.ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 16px;border-bottom:1px solid var(--line2);font-weight:600}
.panel>.ph small{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
.panel>.pb{padding:14px 16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;background:var(--neu-bg);color:var(--neu)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.err{background:var(--err-bg);color:var(--err)} .pill.info{background:var(--brand-bg);color:var(--brand-d)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:4px}
.facts div{padding:10px 16px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);margin:0 -1px -1px 0;min-width:0}
.facts div>span:first-child{display:block;font-size:12px;color:var(--muted)}
.facts b{font-weight:600}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stage{border:0;border-right:1px solid var(--line2);background:none;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;border-top:3px solid var(--line)}
.stage:last-child{border-right:0}
.stage:hover{background:var(--sub)}
.stage.done{border-top-color:var(--ok)} .stage.cur{border-top-color:var(--brand)} .stage.hold{border-top-color:#C19C00}
.stage .n{font-size:12px;color:var(--muted)}
.stage b{font-weight:600;font-size:15px}
.stage .pill{align-self:flex-start}
.stage .ms{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--muted);align-items:center}
.stage .ms span{display:inline-flex;gap:5px;align-items:center}
@media (max-width:1000px){.stages{grid-template-columns:repeat(3,minmax(0,1fr))}.stage{border-bottom:1px solid var(--line2)}}
@media (max-width:560px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line2);font-size:13.5px}
.list li:last-child{border-bottom:0}
.list time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.list .who{font-weight:600;flex:none;min-width:74px}
.empty{padding:22px 16px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sub)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}
.id{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lnk{border:0;background:none;padding:0;color:var(--brand-d);text-align:left;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.lnk:hover{text-decoration:underline}
.xl{border:1px solid #C8C8C8;border-top:3px solid var(--c-excel)}
.xl table{min-width:720px}
.xl th,.xl td{border:1px solid #D9D9D9;padding:6px 10px}
.xl th{background:#F3F2F1;color:var(--neu)}
.xl .rn{background:#F3F2F1;color:var(--muted);text-align:center;width:34px;font-size:12px}
.xl .cl th{text-align:center;font-weight:400;font-size:12px;padding:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:15px}
.crumb button{border:0;background:none;padding:2px 4px;border-radius:4px;color:var(--muted)}
.crumb button:hover{background:var(--neu-bg)}
.crumb b{font-weight:600;padding:2px 4px}
.ol{display:grid;grid-template-columns:170px 280px minmax(0,1fr);min-height:420px}
.ol>div{border-right:1px solid var(--line2);min-width:0}
.ol>div:last-child{border-right:0}
.ol .fl{padding:8px 0}
.ol .fl div{padding:7px 16px;display:flex;justify-content:space-between}
.ol .fl .on{background:var(--brand-bg);font-weight:600}
.ol .msg{padding:12px 14px;border-left:3px solid var(--brand);background:var(--brand-bg)}
.ol .msg b{display:block}
.ol .msg small{color:var(--muted)}
.ol .rd{padding:16px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){.ol{grid-template-columns:minmax(0,1fr)}.ol>div{border-right:0;border-bottom:1px solid var(--line2)}.ol .fl{display:none}}
.att{display:flex;flex-wrap:wrap;gap:8px}
.att button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 10px;max-width:100%}
.att button:hover{background:var(--sub)}
.bar-info{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 12px;border-radius:4px;background:var(--brand-bg);border:1px solid #B4D6FA;font-size:13.5px}
.bar-info>span:not(.tile){flex:1 1 240px;min-width:0}
.bar-info{flex-wrap:nowrap}
@media (max-width:600px){.bar-info{flex-wrap:wrap}}
.bar-info.ok{background:var(--ok-bg);border-color:#9FD89F}
.bar-info.warn{background:var(--warn-bg);border-color:#F4BFAB}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:980px){.flow{grid-template-columns:minmax(0,1fr)}}
.canvas{background:#F3F2F1;border:1px solid var(--line);border-radius:4px;padding:20px 12px;display:flex;flex-direction:column;align-items:center}
.fa{width:min(100%,440px);display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid #C8C6C4;border-radius:4px;padding:0;text-align:left;min-height:46px;overflow:hidden}
.fa .ct{align-self:stretch;width:42px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.fa .fx{flex:1;min-width:0;padding:6px 0}
.fa b{display:block;font-weight:600;font-size:13.5px}
.fa small{color:var(--muted);font-size:12px}
.fa .st{margin-right:10px;flex:none}
.fa.sel{outline:2px solid var(--brand);outline-offset:1px}
.fa.run,.fa.next{border-color:var(--brand);box-shadow:0 0 0 2px #B4D6FA}
.fa.wait{border-color:#C19C00;box-shadow:0 0 0 2px #F2E3A6}
.fa.pend{opacity:.72}
.arr{width:2px;height:18px;background:#8A8886;position:relative;margin:2px 0 6px}
.arr::after{content:"";position:absolute;left:-4px;bottom:-4px;border:5px solid transparent;border-top-color:#8A8886;border-bottom:0}
.brs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:min(100%,640px);margin-top:8px;border-top:2px solid #8A8886;padding-top:10px}
.br{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bl{font-size:12px;font-weight:600;padding:1px 10px;border-radius:10px}
.bl.yes{background:var(--ok-bg);color:var(--ok)} .bl.no{background:var(--err-bg);color:var(--err)}
.noop{font-size:12.5px;color:var(--muted);border:1px dashed #C8C6C4;border-radius:4px;padding:10px;text-align:center;width:100%}
.det{position:sticky;top:8px}
.det dl{margin:0;display:grid;gap:10px}
.det dt{font-size:12px;color:var(--muted)}
.det dd{margin:0}
.appr{background:var(--surface);border:1px solid #C19C00;border-radius:4px}
.appr .ah{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line2)}
.appr .ah b{font-weight:600}
.appr .ab{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.appr h4{font-size:14px;font-weight:600;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 12px;border-radius:4px;border:1px solid #D1D1D1;background:var(--surface)}
.opt:hover{background:var(--sub)}
.opt i{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid #616161;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-bg)}
.opt[aria-pressed="true"] i{border-color:var(--brand);background:radial-gradient(var(--brand) 48%,transparent 54%)}
.opt small{display:block;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts .hint{font-size:12.5px;color:var(--muted)}
.blist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.doc{background:var(--surface);border:1px solid #C8C6C4;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:28px 32px;max-width:760px;position:relative;overflow:hidden}
.doc h3{font-size:20px;font-weight:600;margin-bottom:2px}
.doc section{padding:12px 0;border-top:1px solid var(--line2)}
.doc section h4{font-size:12px;color:var(--c-word);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:min(20vw,130px);font-weight:700;letter-spacing:.08em;color:#8A8886;opacity:.13;transform:rotate(-20deg)}
@media (max-width:600px){.doc{padding:18px 16px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border-radius:8px;width:min(860px,100%);max-height:min(88vh,760px);overflow:auto;box-shadow:0 16px 48px rgba(0,0,0,.28)}
.dlg .dh{position:sticky;top:0;background:var(--surface);display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);z-index:1}
.dlg .dh b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dlg .dh small{color:var(--muted);white-space:nowrap}
.dlg .db{padding:16px;background:#F3F2F1;display:flex;flex-direction:column;gap:12px}
.page{background:var(--surface);border:1px solid #C8C6C4;padding:22px;display:flex;flex-direction:column;gap:8px}
.page .loc{font-size:12px;color:var(--muted)}
.page mark{background:#FFF4CE;color:inherit;padding:2px 3px;font-weight:600}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 8px}
  .rail .grp{display:none}
  .nav{border-left:0;border-bottom:3px solid transparent;padding:0 10px;width:auto;flex:none;height:40px}
  .nav[aria-current="true"]{border-bottom-color:var(--brand)}
  .nav .dot{margin-left:4px}
  .guide{grid-template-columns:minmax(0,1fr)}
  .det{position:static}
}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}
</style>

   ${S.dev&&S.miss?'':'<span class="hint">Välj ett alternativ för båda punkterna.</span>'}</div></div></div>`:''}
 ${done('eng')?`<div class="bar-info ok"><b>Godkänt av Engineering.</b><span>${DEVT[S.dev]}. ${MIST[S.miss]}.</span></div>`:''}
 <div class="panel"><div class="ph">${tile('excel')}Jämförelsematris<small>sparad i 03_Engineering</small></div><div class="pb" style="padding:12px">${matrix()}</div></div>
 <div class="panel"><div class="ph">Produktkandidater<small>från godkänd produktdatakälla</small></div>${cands()}
  <div class="pb" style="border-top:1px solid var(--line2);font-size:13px"><b>Hög likhet är inte teknisk uppfyllelse.</b> Likhet visar hur lik en tidigare produkt är förfrågan. Kandidaten med högst likhet har ändå en avvikelse. Uppfyllelse fastställs av Engineering.</div></div>`},

kommersiellt(){const h=vh('Kommersiellt','Pris, ledtid och risker räknas fram med fasta regler på de tekniska beslut som Engineering har godkänt.',by('A4 – Commercial Analysis','Excel, Godkännanden'));
 if(!done('a4'))return h+notYet('Beräkningen görs när Engineering har godkänt det tekniska underlaget.');
 const rk=comRisk(),w=S.wait==='com';
 return h+`${S.stopped&&S.ip===IX.com?stopped():''}
 ${w&&!S.stopped?`<div class="appr">${apprHead('Kommersiell granskning','säljare')}<div class="ab"><p>Granska beräkningen och riskerna nedan innan offerten tas fram.</p>
  <div class="acts"><button class="btn pri" data-act="comOk">Godkänn kommersiellt underlag</button><button class="btn" data-act="comBack">Skicka tillbaka till Teknik</button><button class="btn" data-act="stop">Avvisa – offerera inte</button></div></div></div>`:''}
 ${done('com')?`<div class="bar-info ok"><b>Godkänt av Sälj.</b><span>Prisbas ${eur(money().cost)}, ledtid ${money().lead} veckor.</span></div>`:''}
 <div class="panel"><div class="ph">${tile('excel')}Kalkyl<small>sparad i 04_Commercial · Rev ${L(S.rev.com)}</small></div><div class="pb" style="padding:12px">${calc()}</div></div>
 <div class="two"><div class="panel"><div class="ph">Kommersiella risker</div>${rk.length?`<ul class="list">${rk.map(r=>`<li>${pill(r[0],r[0]==='err'?'Hög':'Medel')}<span>${r[1]}</span></li>`).join('')}</ul>`:'<div class="empty">Inga identifierade risker. Offerten uppfyller krav och önskad ledtid.</div>'}</div>
 <div class="panel"><div class="ph">Information som saknas</div><ul class="list">${missing().map(m=>`<li>${pill('','Information saknas')}<span>${m}</span></li>`).join('')}</ul></div></div>
 <p style="font-size:12.5px;color:var(--muted)">Räkneregler i demon: grundpris 42 000 EUR och 16 veckor. Förlängd krypsträcka +3 800 EUR och +3 veckor. Seismisk provning +6 500 EUR och +4 veckor. Exempelvärden.</p>`},

offert(){const h=vh('Offert','Ett offertutkast skapas från mall med enbart godkända uppgifter. En behörig person fattar slutbeslutet.',by('A5 – Quotation, A2 – Documentation','Word-mall, Godkännanden, SharePoint'));
 if(!done('a5'))return h+notYet('Offertutkastet skapas när det kommersiella underlaget är godkänt.');
 const w=S.wait==='fin',ok=done('fin');
 return h+`${w?`<div class="appr">${apprHead('Slutgodkännande','behörig godkännare')}<div class="ab"><p>Inget skickas till kunden utan ditt godkännande.</p>
  <div class="acts"><button class="btn pri" data-act="finOk">Godkänn offerten</button><button class="btn" data-act="finBack">Skicka tillbaka för revidering</button></div></div></div>`:''}
 ${ok?`<div class="bar-info ok"><b>Godkänd av behörig person.</b><span>${done('sp3')?'Offert och beslutshistorik är sparade i SharePoint.':'Sparas i SharePoint i nästa steg.'}</span><button class="btn" data-act="folder" data-v="5">Öppna 06_Approvals</button></div>
  <div class="panel"><div class="ph">Beslut fattade av personer</div>${history()}</div>`:''}
 ${quote(ok)}`},

inforande(){const R=[
 ['Mottagning av förfrågan','Outlook (Exchange Online), Power Automate','Delad brevlåda, anslutning med rätt behörighet, regler för vilka mejl som startar flödet.'],
 ['Projektlagring','SharePoint','Webbplats och bibliotek, kolumner för status och revision, behörigheter per kund och projekt, regler för bevarande.'],
 ['Styrning av processen (PL)','Power Automate','Molnflöde i godkänd miljö, tjänstkonto, policy för dataförlustskydd. Licensbehov beror på anslutningarna.'],
 ['Kravanalys (A1, A2)','Copilot Studio eller AI Builder','AI-tjänst som normalt kräver egen licens eller kapacitet. Kvalitetssäkring av resultat och klassning av kunddata.'],
 ['Teknisk matchning (A3)','Excel, SharePoint-lista eller affärssystem','En ägd och godkänd källa för produktdata. Eventuell integration mot konstruktions- eller affärssystem.'],
 ['Granskningar','Godkännanden i Teams och Power Automate','Bestämda roller som får godkänna, delegering vid frånvaro, loggning.'],
 ['Kommersiell analys (A4)','Excel','Räkneregler som ägs av Sälj. Eventuell integration mot pris- och ledtidskälla.'],
 ['Offert (A5)','Word-mall i SharePoint','Godkända mallar. Mallifyllnad och PDF kan kräva premium-anslutning.'],
 ['Meddelanden','Teams','Kanaler och behörighet för flödet att publicera.']];
 return vh('Införande','Vad som är simulerat här och vad en verklig lösning skulle behöva.')+`
 <div class="bar-info warn"><span><b>Microsoft 365-licenser omfattar inte automatiskt alla funktioner.</b> Vilka licenser, behörigheter och integrationer som krävs måste bekräftas med IT. En verklig lösning ska köras i godkänd Microsoft 365-miljö och följa företagets IT-säkerhetskrav.</span></div>
 <div class="panel"><div class="tw"><table style="min-width:820px"><thead><tr><th>Steg i processen</th><th>Microsoft-tjänst som skulle ansvara</th><th>I demon</th><th>Krävs i en verklig lösning</th></tr></thead><tbody>
 ${R.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${pill('','Simulerat')}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="panel"><div class="ph">Principer som gäller oavsett teknik</div><div class="pb"><ul class="blist"><li>SharePoint är dokumentarkivet. PL – Project Manager håller ordning och status men lagrar inga dokument.</li><li>AI gör specialiserad analys och lämnar beslutsunderlag.</li><li>Engineering och Sälj behåller rätten att godkänna.</li><li>Varje viktigt beslut sparas som en godkännandepost.</li></ul></div></div>`}
};
const cur=()=>FLOW[Math.min(S.ip,FLOW.length-1)].id;

/* ---------- render ---------- */
function render(){
 const wv=S.wait&&!S.stopped?WAIT[S.wait].v:null;
 $('rail').innerHTML=NAV.map(n=>n[0]==='grp'?`<div class="grp">${n[1]}</div>`:`<button class="nav" data-act="view" data-v="${n[0]}" aria-current="${S.view===n[0]}">${tile(n[2],n[3])}${n[1]}${wv===n[0]?'<span class="dot" title="Väntar på person"></span>':''}</button>`).join('');
 const end=S.ip>=FLOW.length,st=status(),can=!S.wait&&!S.stopped&&!end;
 $('cmd').innerHTML=`
  ${S.auto&&can?`<button class="btn pri" data-act="pause">Pausa</button>`:`<button class="btn pri" data-act="run" ${can?'':'disabled'}>${S.ip===0?'Starta simulerad RFQ':'Fortsätt'}</button>`}
  <button class="btn" data-act="step" ${can?'':'disabled'}>Stega</button>
  <button class="btn" data-act="reset">Starta om</button>
  ${wv?`<button class="btn" data-act="view" data-v="${wv}">Öppna granskning</button>`:''}
  <span class="sp">${pill(st[0],st[1])}</span>
  <button class="btn" data-act="pres" aria-pressed="${S.pres}">Presentationsläge</button>`;
 $('content').innerHTML=(S.pres?guide():'')+VIEW[S.view]();
 $('ov').innerHTML=S.pv?preview(S.pv):'';
}
function guide(){const p=PRES[S.ps],nx=PRES[S.ps+1],blocked=nx&&nx.need&&!done(nx.need);
 return `<div class="guide"><div><div class="k">${S.ps?`Steg ${S.ps} av 8`:'Presentation'}</div><h3>${p.t}</h3><p>${p.x}</p>
  <p class="val">${S.ps?'<b>Verksamhetsnytta:</b> ':''}${p.v}</p>
  ${S.stopped?'<p class="hint">Projektet är avbrutet. Välj Starta om för att börja om.</p>':blocked?`<p class="hint">Ett beslut av en person krävs för att gå vidare: ${WAIT[nx.need].n}.</p>`:''}</div>
  <div class="ga"><button class="btn" data-act="pprev" ${S.ps?'':'disabled'}>Föregående</button>
  ${blocked&&!S.stopped?`<button class="btn pri" data-act="view" data-v="${WAIT[nx.need].v}" ${S.view===WAIT[nx.need].v?'disabled':''}>${S.view===WAIT[nx.need].v?'Beslut krävs nedan':'Gå till beslutet'}</button>`:`<button class="btn pri" data-act="pnext" ${nx&&!S.stopped?'':'disabled'}>Nästa</button>`}</div></div>`}
function goStep(k){const p=PRES[k];if(p.need&&!done(p.need))return;S.mode='';S.ps=k;if(p.until)runTo(p.until);S.view=p.view;if('folder' in p)S.folder=p.folder}

/* ---------- actions ---------- */
const ACT={
 view(v){S.view=v},
 folder(v){S.view='sharepoint';S.folder=v===''||v==null?null:+v},
 pv(v){S.pv=v},closepv(){S.pv=null},
 sel(v){S.sel=v},
 pres(){S.pres=!S.pres},
 pnext(){goStep(S.ps+1)},
 pprev(){S.ps--;S.view=PRES[S.ps].view;if('folder' in PRES[S.ps])S.folder=PRES[S.ps].folder},
 run(){S.mode='';S.auto=true;if(S.ip===0){step()}schedule()},
 startflow(){S.mode='';S.auto=true;step();S.view='flode';schedule()},
 pause(){S.auto=false;halt()},
 step(){S.mode='step';S.auto=false;halt();step()},
 reset(){halt();const pres=S.pres;S=fresh();S.pres=pres},
 clar(v){S.clar=v;log('Person','Klargörande: omgivningstemperatur '+TEMP[v]);log('A2','Kravregister uppdaterat till Rev B');decide('clar','Klargörande av krav','Omgivningstemperatur: '+TEMP[v],'Ansvarig säljare','Besvarad')},
 dev(v){S.dev=v},miss(v){S.miss=v},
 engOk(){if(!(S.dev&&S.miss))return;log('Person','Tekniskt underlag godkänt av Engineering');decide('eng','Teknisk granskning',DEVT[S.dev]+'. '+MIST[S.miss]+'.','Engineering')},
 comOk(){log('Person','Kommersiellt underlag godkänt av Sälj');decide('com','Kommersiell granskning','Prisbas '+eur(money().cost)+', ledtid '+money().lead+' veckor.','Sälj')},
 finOk(){log('Person','Offerten godkänd av behörig person');decide('fin','Slutgodkännande','Offert Rev '+L(S.rev.q)+' godkänd för att skickas till kunden.','Behörig godkännare')},
 comBack(){log('Person','Skickat tillbaka till Teknik för ny granskning');S.dec=S.dec.filter(d=>d.k!=='eng');S.rev.eng++;S.rev.com++;S.ip=IX.eng;S.wait=null;halt();settle();S.view='teknik'},
 finBack(){log('Person','Offerten skickad tillbaka för revidering');S.dec=S.dec.filter(d=>d.k!=='com');S.rev.q++;S.ip=IX.com;S.wait=null;settle();S.view='kommersiellt'},
 stop(){S.stopped=true;S.auto=false;halt();log('Person','Projektet avbrutet vid '+WAIT[S.wait].n)}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 if(b.classList.contains('ov')&&e.target!==b)return;
 const act=b.dataset.act,y=window.scrollY,v0=S.view;
 ACT[act](b.dataset.v);render();
 if(act==='pv'){const c=$('closePv');c&&c.focus()}
 else if(S.view!==v0||act==='pnext'||act==='pprev'||act==='folder')window.scrollTo(0,0);
 else window.scrollTo(0,y);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pv){S.pv=null;render()}});
S=fresh();render();
})();
</script>
</body>
</html>
