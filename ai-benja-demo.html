<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>AI Benja Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: orchestrator sidebar (dark blue) beside a stage workspace; the pipeline strip on top is the navigation. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#F5F7FA; --line:#D5DBE5; --fg:#1A2333; --muted:#5A6678;
  --pm:#123E7C; --pm-ink:#FFFFFF; --accent:#1B5FBF;
  --a1:#2F9BE3; --a2:#1C8A3C; --a3:#B88A00; --a4:#DD6B10; --a5:#8560C4; --hu:#3A485D;
  --ok:#1C8A3C; --dev:#C95F0A; --miss:#6F7A8B; --pdf:#C4314B; --hold:#FFC83D; --hold-ink:#2A2000; --hi:#FFF1B8;
  --sh:0 1px 2px rgba(20,35,60,.06),0 4px 14px rgba(20,35,60,.06);
  --font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C111B; --surface:#182132; --sunk:#121927; --line:#2E3B52; --fg:#E7ECF5; --muted:#9BA8BC;
  --pm:#1B4F9E; --pm-ink:#FFFFFF; --accent:#6FB1F5;
  --a1:#4CAEEF; --a2:#3DB060; --a3:#D9A91A; --a4:#F08432; --a5:#A283DC; --hu:#56667F;
  --ok:#3DB060; --dev:#F08432; --miss:#8B96A8; --pdf:#E0566E; --hold:#FFC83D; --hold-ink:#2A2000; --hi:#5A4A10;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C111B; --surface:#182132; --sunk:#121927; --line:#2E3B52; --fg:#E7ECF5; --muted:#9BA8BC;
  --pm:#1B4F9E; --pm-ink:#FFFFFF; --accent:#6FB1F5;
  --a1:#4CAEEF; --a2:#3DB060; --a3:#D9A91A; --a4:#F08432; --a5:#A283DC; --hu:#56667F;
  --ok:#3DB060; --dev:#F08432; --miss:#8B96A8; --pdf:#E0566E; --hold:#FFC83D; --hold-ink:#2A2000; --hi:#5A4A10;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
.ic{flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--a1);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.bar h1{font-size:20px;font-weight:700;letter-spacing:.01em}
.bar .sub{color:var(--muted);font-size:14px}
.bar .sp{margin-left:auto}
.btn{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06121F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#06121F}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--dev);color:var(--dev)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on-pm{background:#fff;color:#123E7C;border-color:#fff}

/* pipeline */
.pipe{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:12px}
.pipe ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;min-width:1040px}
.pipe li{flex:1 1 0;display:flex;align-items:center;gap:6px;min-width:0}
.pipe li+li::before{content:"›";color:var(--muted);font-weight:700}
.node{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--sunk);font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;text-align:center;line-height:1.2;color:var(--muted)}
.node .dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--line);color:var(--muted)}
.node.done{color:var(--fg);border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.node.done .dot,.node.cur .dot{background:var(--c);color:#fff}
.node.cur{color:var(--fg);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.node.wait{border-color:var(--hold);box-shadow:0 0 0 3px color-mix(in srgb,var(--hold) 45%,transparent)}
.node[aria-current="true"]{outline:2.5px solid var(--accent);outline-offset:2px}
.node small{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:none}

.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

/* orchestrator */
.pm{background:var(--pm);color:var(--pm-ink);border-radius:10px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:14px}
.pm .hd{display:flex;gap:12px;align-items:center}
.pm .hd span{width:42px;height:42px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.pm h2{font-size:17px;font-weight:600}
.pm .k{font-size:12px;opacity:.75;letter-spacing:.05em;text-transform:uppercase}
.pm .proj{display:flex;justify-content:space-between;gap:10px;align-items:end;border-top:1px solid rgba(255,255,255,.22);padding-top:12px}
.pm .proj{flex-wrap:wrap}
.pm .proj b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:13px;font-size:12px;font-weight:700;letter-spacing:.05em;background:#fff;color:#123E7C;white-space:nowrap}
.pill.hold{background:var(--hold);color:var(--hold-ink)}
.pill.ok{background:#CDEFD6;color:#0F4F22}
.pm .next{background:rgba(255,255,255,.12);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pm .next p{font-size:15px;font-weight:600}
.trk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trk div{background:rgba(255,255,255,.1);border-radius:8px;padding:9px 11px}
.trk b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.trk span{font-size:12px;opacity:.82}
.pm ul{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:5px}
.pm ul li{display:flex;gap:8px;opacity:.92}
.pm ul li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--hold);margin-top:7px}
.log{max-height:190px;overflow:auto;border-top:1px solid rgba(255,255,255,.22);padding-top:10px}
.log li::before{background:rgba(255,255,255,.6)!important}
.log time{opacity:.65;font-variant-numeric:tabular-nums;flex:none}

/* workspace */
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);min-width:0}
.card>.ch{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.card>.ch small{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted)}
.card>.cb{padding:16px}
.shead{display:flex;gap:14px;align-items:center}
.shead .at{width:52px;height:52px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.shead small{display:block;color:var(--muted);font-size:13px}
.shead h2{font-size:24px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--muted);max-width:68ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fact{background:var(--sunk);border-radius:8px;padding:10px 12px}
.fact span{display:block;font-size:12px;color:var(--muted);letter-spacing:.03em}
.fact b{font-weight:600}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.file{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;min-width:0;width:100%}
.file:hover{border-color:var(--accent)}
.file em{font-style:normal;font-size:10px;font-weight:700;color:#fff;background:var(--c,var(--pdf));width:34px;height:26px;border-radius:5px;display:grid;place-items:center;flex:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.file small{margin-left:auto;color:var(--muted);white-space:nowrap}
.sk{height:9px;border-radius:5px;background:color-mix(in srgb,var(--muted) 22%,var(--surface))}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.id{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;color:var(--accent);font-size:13px;text-align:left;text-decoration:underline;text-underline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:#fff;background:var(--c);white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.human{background:var(--hu);color:#fff;border-radius:10px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px}
.human .hh{display:flex;gap:12px;align-items:center}
.human .hh span{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.human h3{font-size:16px;letter-spacing:.07em}
.human p{opacity:.9}
.q{background:var(--surface);color:var(--fg);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q h4{margin:0;font-size:15px}
.q .note{color:var(--muted);font-size:13px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt[aria-pressed="true"] i{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.opt small{display:block;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts .hint{font-size:13px;opacity:.85}
.cta{border:1.5px dashed color-mix(in srgb,var(--accent) 60%,var(--line));border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.cta p{flex:1 1 260px;font-weight:600}
.cta small{display:block;font-weight:400;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps li i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.steps li.d{color:var(--fg)}
.steps li.d i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.r i{border-color:var(--c);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.steps li.r i{animation:none}}
.blist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary .fi{width:34px;height:34px;border-radius:8px;background:var(--a2);color:#fff;display:grid;place-items:center;flex:none}
summary small{margin-left:auto;color:var(--muted);font-weight:500}
summary::after{content:"+";color:var(--muted);font-size:18px;width:14px;text-align:center}
details[open] summary::after{content:"–"}
details .in{padding:0 16px 14px 62px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.an{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.an .card{padding:14px;display:flex;flex-direction:column;gap:6px}
.an .t{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--a4)}
.an .t b{color:var(--fg);font-weight:600}
.an .big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.an p,.an li{font-size:14px;color:var(--muted)}
.quote{position:relative;overflow:hidden}
.quote .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:min(22vw,150px);font-weight:700;letter-spacing:.1em;color:var(--a5);opacity:.11;transform:rotate(-20deg)}
.quote section{padding:14px 16px;border-bottom:1px solid var(--line)}
.quote section h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--a5)}
.banner{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;font-weight:700;letter-spacing:.05em;color:#fff;background:var(--a5);text-align:center}
.banner.ok{background:var(--ok)}
.sp-band{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--a2) 45%,var(--line));background:color-mix(in srgb,var(--a2) 10%,var(--surface))}
.sp-band span{width:40px;height:40px;border-radius:8px;background:var(--a2);color:#fff;display:grid;place-items:center;flex:none}
.sp-band small{display:block;color:var(--muted)}
.foot{color:var(--muted);font-size:13px}
/* source viewer */
.ov{position:fixed;inset:0;background:rgba(8,14,24,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);color:var(--fg);border-radius:10px;width:min(620px,100%);max-height:min(86vh,720px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg .ch{position:sticky;top:0;background:var(--surface)}
.page{margin:16px;padding:22px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);font-size:14px;display:flex;flex-direction:column;gap:10px}
.page .loc{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.page mark{background:var(--hi);color:inherit;padding:2px 3px;border-radius:3px;font-weight:600}
</style>

<div class="wrap">
  <header class="bar">
    <h1>AI Benja</h1><span class="sub">AI Agents for Sales &amp; Engineering · interactive demo</span>
    <button class="btn sp" id="reset" data-act="reset">Restart demo</button>
  </header>
  <nav class="pipe" aria-label="Process steps"><ol id="pipe"></ol></nav>
  <div class="grid">
    <aside class="pm" id="pm" aria-label="AI Project Manager"></aside>
    <main id="main"></main>
  </div>
  <p class="foot">Simulated demo. The customer, documents, product articles, prices and lead times are invented example data, and the agents here follow a script rather than calling a live AI model.</p>
</div>
<div id="ov"></div>

<script>
(function(){
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const $=id=>document.getElementById(id);

const STG=[
 {id:'rfq',kind:'in',label:'Customer RFQ',icon:'mail',c:'miss'},
 {id:'a1',kind:'agent',label:'A1 Intake',name:'A1 – Requirement Intake Agent',icon:'intake',c:'a1',status:'INTAKE',
  does:'Reads all customer documents together and turns them into structured, traceable requirements.',

 return shead(s,'Commercial Decision Support')+`<div class="an">
  <div class="card"><div class="t">${ic('coin',20)}<b>Cost</b></div><div class="big">${eur(m.cost)}</div><ul class="blist"><li>Base article ${eur(42000)}</li>${S.dev==='variant'?`<li>Variant 145-B-4650 +${eur(3800)}</li>`:''}${S.miss==='test'?`<li>Seismic test +${eur(6500)}</li>`:''}<li>Estimate for 1 unit</li></ul></div>
  <div class="card"><div class="t">${ic('clock',20)}<b>Lead Time</b></div><div class="big">${m.lead} weeks</div><p>Customer requested 20 weeks. ${late?'This is '+(m.lead-20)+' weeks longer.':'This is within the request.'}</p></div>
  <div class="card"><div class="t">${ic('warn',20)}<b>Commercial Risk</b></div><div class="big">${cr[0]}</div><p>${cr[1]}</p></div>
  <div class="card"><div class="t">${ic('gear',20)}<b>Technical Risk</b></div><div class="big">${tr[0]}</div><p>${tr[1]}</p></div>
  <div class="card"><div class="t">${ic('bulb',20)}<b>Opportunities</b></div><ul class="blist"><li>Customer Standard CS-104 is now registered, so the next RFQ from this customer is faster to process.</li>${S.dev==='variant'?'<li>Variant 145-B-4650 can be reused for other heavy-pollution sites.</li>':''}</ul></div>
  <div class="card"><div class="t">${ic('q',20)}<b>Missing Information</b></div><ul class="blist">${missing().map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`},

com(){const s=STG[6];if(S.pos<6)return notYet(s);
 if(S.pos>6)return shead(s,'Human checkpoint · completed')+humanDone('Commercial approval recorded',[`Price basis ${eur(money().cost)} for 1 unit`,`Lead time ${money().lead} weeks`]);
 if(S.stopped)return shead(s,'Human checkpoint')+`<div class="card"><div class="cb"><b>Stopped at commercial review.</b><p class="lead">Restart the demo to try another path.</p></div></div>`;
 const m=money();
 return shead(s,'Human checkpoint · the process is paused')+`<div class="human"><div class="hh"><span>${ic('person',24)}</span><div><h3>COMMERCIAL REVIEW</h3><p>You are the commercial reviewer. Check the decision support from A4 before the project continues.</p></div></div>
  <div class="q"><h4>Summary from A4</h4><div class="cols"><div class="fact"><span>Cost estimate</span><b>${eur(m.cost)}</b></div><div class="fact"><span>Lead time</span><b>${m.lead} weeks (requested 20)</b></div><div class="fact"><span>Open items</span><b>${missing().length}</b></div></div>
  <button class="src" data-act="view" data-v="a4">${ic('chart',14)}Open the full analysis</button></div>
  <div class="acts"><button class="btn pri" data-act="comOk">${ic('check',16)}Approve commercial basis</button><button class="btn warn" style="background:var(--surface)" data-act="stop">Stop – do not quote</button></div></div>`},

a5(){const s=STG[7];if(!hasOut('a5'))return shead(s,'Specialist agent · activated by the AI Project Manager')+agentIdle(s);return shead(s,'Quotation Draft')+quote(S.pos>IX.fin)},

fin(){const s=STG[8];if(S.pos<8)return notYet(s);
 if(S.pos>8)return shead(s,'Human checkpoint · completed')+humanDone('Final quote approval recorded',['Quotation RFQ-12345 approved for sending to the customer']);
 return shead(s,'Human checkpoint · the process is paused')+`<div class="human"><div class="hh"><span>${ic('person',24)}</span><div><h3>FINAL APPROVAL</h3><p>You carry out the final review. Nothing is sent to the customer without your approval.</p></div></div>
  <div class="acts"><button class="btn pri" data-act="finOk">${ic('check',16)}Approve quotation</button><button class="btn" style="color:var(--fg)" data-act="finBack">Return to commercial review</button></div></div>`+quote(false)},

out(){const s=STG[9];if(S.pos<9)return `<div class="shead" style="--c:var(--ok)"><div class="at">${ic('check',28)}</div><div><small>Result</small><h2>Customer Quotation</h2></div></div><div class="card"><div class="cb"><p class="lead">Not reached yet. The quotation exists only after a person has given final approval.</p></div></div>`;
 return `<div class="shead" style="--c:var(--ok)"><div class="at">${ic('check',28)}</div><div><small>Traceable. Controlled. Human-approved.</small><h2>Customer Quotation</h2></div></div>
 <div class="card"><div class="ch">${ic('person',20)}Decisions made by people</div><div class="cb"><ul class="blist">${S.decisions.map(d=>`<li><b>${d[0]}:</b> ${d[1]}</li>`).join('')}</ul></div></div>`+quote(true)}
};
function quote(ok){const m=money();
 return `<div class="card quote">${ok?'':'<div class="wm">DRAFT</div>'}
 <div class="ch">${ic('quote',20)}Quotation ${ok?'':'Draft'}<small>RFQ-12345</small></div>
 <section><h4>Customer and RFQ</h4>Example Customer AB · RFQ-12345 – Request for Quotation</section>
 <section><h4>Product</h4>${S.dev==='variant'?'145 kV outdoor unit, article 145-B-4650 (variant)':'145 kV outdoor unit, article 145-A-4200'}</section>
 <section><h4>Technical requirements</h4><ul class="blist">
  <li>Nominal voltage 145 kV: complies</li>
  <li>Creepage distance: ${S.dev==='variant'?'4650 mm, complies with required 4500 mm':'4200 mm. Deviation from required 4500 mm, approved for offering by engineering'}</li>
  <li>Weight: ${S.dev==='variant'?'940':'910'} kg, complies with maximum 950 kg</li>
  <li>Seismic qualification: ${S.miss==='test'?'qualification test included in scope':'exception, not verified, open item'}</li>
  <li>Ambient temperature: ${S.clar==='ask'?'to be confirmed by customer, product rated −40 … +40 °C':TEMP[S.clar]+', complies'}</li></ul></section>
 <section><h4>Commercial conditions</h4>Price ${eur(m.cost)} per unit. Quantity to be confirmed by the customer.</section>
 <section><h4>Delivery information</h4>${m.lead} weeks after order (requested: 20 weeks).</section>
 <section><h4>References</h4><ul class="blist"><li>${FILES.map(f=>f[0]+' '+f[1]).join(' · ')}</li><li>Requirement register REQ-001 … REQ-006</li><li>Engineering review and commercial review approved by a person</li></ul></section>
 <div class="banner ${ok?'ok':''}">${ic(ok?'check':'warn',20)}${ok?'APPROVED BY A PERSON – READY TO SEND':'DRAFT – HUMAN APPROVAL REQUIRED'}</div></div>`}
function viewer(k){const d=SRC[k];
 return `<div class="ov" data-act="close"><div class="dlg" role="dialog" aria-modal="true" aria-label="${d.file}"><div class="card" style="border:0;box-shadow:none">
  <div class="ch">${ic('link',18)}${d.file}<small><button class="btn" data-act="close" id="closeSrc">Close</button></small></div>
  <div class="page"><div class="loc">${d.loc} · original stored in SharePoint</div>${d.lines.map(l=>/^\*/.test(l)?`<p><mark>${l.replace(/\*/g,'')}</mark></p>`:`<p>${l}</p>`).join('')}</div></div></div></div>`}

/* ---------- actions ---------- */
function advance(){S.pos++;const c=cur();S.phase=c.kind==='human'?'review':c.kind==='out'?'done':'ready'}
function runAgent(){const c=cur();if(c.kind!=='agent'||S.phase!=='ready')return;
 S.phase='running';S.run=0;S.view=c.id;log('Dispatched project to '+c.name);render();
 const fast=matchMedia('(prefers-reduced-motion: reduce)').matches;
 timer=setInterval(()=>{S.run++;
  if(S.run>=c.run.length){clearInterval(timer);timer=null;finish(c)}
  render()},fast?120:520)}
function finish(c){
 if(c.id==='a1'){S.phase='clarify';log('A1 extracted 6 requirements, 1 unclear, 1 item missing');log('Process paused: human review required')}
 else{ const msg={a2:'A2 organized the project and created the requirement register',a3:'A3 found '+cmp().filter(r=>r[4]==='ok').length+' matches, 1 deviation and '+cmp().filter(r=>r[4]==='miss').length+' missing data',a4:'A4 compiled Commercial Decision Support',a5:'A5 prepared the quotation draft'}[c.id];
  log(msg);advance();if(cur().kind==='human')log('Process paused: '+cur().label.toLowerCase()+' required')}}
const ACT={
 reset(){if(timer){clearInterval(timer);timer=null}S=fresh()},
 view(v){S.view=v},
 create(){log('Project RFQ-12345 created from 1 email and 4 documents');log('Original documents stored in SharePoint');S.pos=1;S.phase='ready'},
 run(){runAgent();return false},
 src(v){S.src=v},
 close(){S.src=null},
 filter(v){S.filter=v},
 clar(v){S.clar=v;S.decisions.push(['Requirement clarification','Ambient temperature range: '+TEMP[v]]);log('Person answered: ambient temperature '+TEMP[v]);advance()},
 dev(v){S.dev=v},miss(v){S.miss=v},
 engOk(){if(!(S.dev&&S.miss))return;S.decisions.push(['Engineering approval',DEVT[S.dev]+'. '+MIST[S.miss]+'.']);log('Engineering data approved by a person');advance()},
 comOk(){S.decisions.push(['Commercial approval','Price basis '+eur(money().cost)+', lead time '+money().lead+' weeks.']);log('Commercial basis approved by a person');advance()},
 finOk(){S.decisions.push(['Final quote approval','Quotation approved for sending to the customer.']);log('Quotation approved by a person');advance();S.view='out'},
 finBack(){log('Quotation returned to commercial review by a person');S.decisions=S.decisions.filter(d=>d[0]!=='Commercial approval');S.pos=IX.com;S.phase='review';S.view='com'},
 stop(){S.stopped=true;log('Project stopped by a person at '+cur().label.toLowerCase())}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 if(b.dataset.act==='close'&&b.classList.contains('ov')&&e.target!==b)return;
 const act=b.dataset.act,keep=window.scrollY;
 if(ACT[act](b.dataset.v)===false)return;
 render();
 if(act==='src'){const c=$('closeSrc');c&&c.focus()}
 else if(act==='view'||act==='create'||/Ok$|clar|finBack/.test(act)){const m=$('main');if(m.getBoundingClientRect().top<0||innerWidth<=860)m.scrollIntoView({block:'start'})}
 else window.scrollTo(0,keep);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.src){S.src=null;render()}});
S=fresh();render();
})();
</script>
</body>
</html>
